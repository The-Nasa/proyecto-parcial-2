server {
    listen 80;
    server_name localhost;

    # Archivos estáticos del Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy hacia el Microservicio 1: Catálogo de Productos (Python - FastAPI)
    location /api/products {
        proxy_pass http://product-service:8000/api/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Documentación Swagger / OpenAPI de FastAPI (Python)
    location /docs {
        proxy_pass http://product-service:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /openapi.json {
        proxy_pass http://product-service:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse Proxy hacia el Microservicio 2: Reseñas y Calificaciones (Node.js - Express)
    location /api/reviews {
        proxy_pass http://review-service:3000/api/reviews;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sonda de salud del Frontend
    location /health/live {
        access_log off;
        return 200 '{"status":"alive","service":"frontend"}';
        add_header Content-Type application/json;
    }
}
