name: CI/CD Pipeline - Parcial 2 CloudStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # Necesario para federación OpenID Connect (OIDC) sin contraseñas fijas
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::881893826841:role/github-actions-deposit-role
  ECR_REGISTRY: 881893826841.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: medio-curso-eks

jobs:
  # ============================================================================
  # ETAPA 1: PRUEBAS AUTOMÁTICAS (Python Pytest + Node.js Jest)
  # ============================================================================
  test:
    name: Run Unit Tests (Python & Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Test Servicio 1: Python FastAPI ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & Run Pytest
        run: |
          cd services/product-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -v

      # --- Test Servicio 2: Node.js Express ---
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/review-service/package.json

      - name: Install Node Dependencies & Run Jest
        run: |
          cd services/review-service
          npm ci
          npm test

  # ============================================================================
  # ETAPA 2: COMPILACIÓN Y PUBLICACIÓN EN AWS ECR (Keyless OIDC)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images to AWS ECR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Product Service (Python)
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/parcial2-product-service:latest -t $ECR_REGISTRY/parcial2-product-service:$IMAGE_TAG ./services/product-service
          docker push $ECR_REGISTRY/parcial2-product-service:latest
          docker push $ECR_REGISTRY/parcial2-product-service:$IMAGE_TAG

      - name: Build and Push Review Service (Node.js)
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/parcial2-review-service:latest -t $ECR_REGISTRY/parcial2-review-service:$IMAGE_TAG ./services/review-service
          docker push $ECR_REGISTRY/parcial2-review-service:latest
          docker push $ECR_REGISTRY/parcial2-review-service:$IMAGE_TAG

      - name: Build and Push Frontend (Nginx)
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/parcial2-frontend:latest -t $ECR_REGISTRY/parcial2-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/parcial2-frontend:latest
          docker push $ECR_REGISTRY/parcial2-frontend:$IMAGE_TAG

  # ============================================================================
  # ETAPA 3: DESPLIEGUE EN AMAZON EKS (Kubernetes)
  # ============================================================================
  deploy:
    name: Deploy to Amazon EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v4

      - name: Update Kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Manifests with Kustomize
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/product-service -n parcial2 --timeout=120s || true
          kubectl rollout status deployment/review-service -n parcial2 --timeout=120s || true
          kubectl rollout status deployment/frontend -n parcial2 --timeout=120s || true
