apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: parcial2
  labels:
    app: frontend
    tier: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
        - name: frontend
          image: 881893826841.dkr.ecr.us-east-1.amazonaws.com/parcial2-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
# ==============================================================================
# SERVICIO PÚBLICO: AWS Elastic Load Balancer (ELB)
# Expone la aplicación web e integra los dos microservicios mediante Reverse Proxy
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: parcial2
  labels:
    app: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "classic"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
